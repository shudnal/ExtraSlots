name: Temporary source-only compatibility update

on:
  push:
    branches: [fix/valheim-1.0.7-compatibility]
    paths: [.github/workflows/apply-valheim-compatibility.yml, .github/scripts/apply_valheim_compatibility.py]

permissions:
  contents: read

concurrency:
  group: apply-valheim-compatibility
  cancel-in-progress: false

jobs:
  apply:
    if: github.repository == 'shudnal/ExtraSlots'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      BRANCH: fix/valheim-1.0.7-compatibility
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Guard the existing branch and fetch the reviewed source baseline
        run: |
          test "$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)" = "$GITHUB_SHA"
          test -f .github/scripts/apply_valheim_compatibility.py
          git fetch --no-tags --depth=1 origin 9d44b48c10a79250a3f58874dd687e7d5641cf4a
      - name: Install prebuilt syntax parser only
        run: |
          python -m venv "$RUNNER_TEMP/source-tools"
          "$RUNNER_TEMP/source-tools/bin/pip" install --only-binary=:all: --disable-pip-version-check tree-sitter==0.25.2 tree-sitter-c-sharp==0.23.1
      - name: Apply guarded sources and inspect syntax without building or running the mod
        run: "$RUNNER_TEMP/source-tools/bin/python .github/scripts/apply_valheim_compatibility.py"
      - name: Commit to the same branch without force-pushing
        run: |
          test "$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)" = "$GITHUB_SHA"
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Complete Valheim 1.0.7 inventory compatibility for ExtraSlots 1.2.1'
          git push origin "HEAD:refs/heads/$BRANCH"
          git show --stat --oneline HEAD
