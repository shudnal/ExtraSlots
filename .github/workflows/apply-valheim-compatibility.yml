name: Temporary source-only compatibility workspace

on:
  push:
    branches: [fix/valheim-1.0.7-compatibility]
    paths: [.github/workflows/apply-valheim-compatibility.yml, .github/scripts/apply_valheim_compatibility.py]

permissions:
  contents: read

concurrency:
  group: apply-valheim-compatibility
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Export mod sources without building or running the mod
        run: |
          mkdir -p "$RUNNER_TEMP/source-export"
          git archive HEAD --prefix=mod/ -o "$RUNNER_TEMP/source-export/mod.tar"
          git rev-parse HEAD > "$RUNNER_TEMP/source-export/mod-head.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: compatibility-source-snapshots
          path: ${{ runner.temp }}/source-export
          retention-days: 1
          if-no-files-found: error
